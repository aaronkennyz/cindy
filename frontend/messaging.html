<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cindy | Messaging</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <script>
      (function() {
        function applySavedColorMode() {
          const themeMode = localStorage.getItem('cindy-ui-theme');
          const isDark = themeMode === 'vamp-purple' || themeMode === 'dark';
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
          document.body.classList.toggle('theme-dark', isDark);
          document.body.classList.toggle('theme-default', !isDark);
        }

        if (document.body) {
          applySavedColorMode();
        } else {
          document.addEventListener('DOMContentLoaded', applySavedColorMode, { once: true });
        }
      })();
    </script>
  </head>
  <body>
    <div class="page-shell">
      <main class="main">
        <section class="topbar">
          <div>
            <h1 class="page-title">Messaging</h1>
            <p class="page-subtitle">Select customers, personalize a template, and open WhatsApp messages in one flow.</p>
          </div>
        </section>

        <section class="grid two-column">
          <div class="card">
            <div class="toolbar">
              <h2 class="card-title">Recipients</h2>
              <button class="btn btn-secondary" id="selectAll" type="button">Select all</button>
            </div>
            <div class="field">
              <label for="recipientSearch">Search</label>
              <input id="recipientSearch" type="search" placeholder="Name or phone">
            </div>
            <div class="customer-list" id="recipientList"></div>
            <button class="btn btn-secondary load-more" id="loadMoreRecipients" type="button" hidden>Load more</button>
          </div>

          <div class="card">
            <h2 class="card-title">Composer</h2>
            <form class="form" id="messageForm" method="post">
              <div class="field">
                <label for="templateSelect">Template</label>
                <select id="templateSelect">
                  <option value="Hi {name}, your membership is expiring soon. Would you like to renew?">Renewal reminder</option>
                  <option value="Hi {name}, thanks for being part of our gym. Your next session is waiting for you.">Friendly check-in</option>
                  <option value="Hi {name}, we have a new plan available. Reply here and we will help you switch.">Plan upgrade</option>
                </select>
              </div>
              <div class="field">
                <label for="messageText">Message</label>
                <textarea id="messageText" required>Hi {name}, your membership is expiring soon. Would you like to renew?</textarea>
              </div>
              <div class="field">
                <label>Preview</label>
                <div class="card preview-box" id="messagePreview"></div>
              </div>
              <div class="form-message" aria-live="polite"></div>
              <button class="btn btn-whatsapp" type="submit">
                <img class="icon" alt="" src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/whatsapp.svg">
                Send with WhatsApp
              </button>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script type="module">
      import { Cindy } from './assets/app.js';

      let customers = [];
      let subscriptions = [];
      let plans = [];
      let messageLog = [];
      let visibleCount = 20;
      const selected = new Set();

      if (await Cindy.requireWorkspace('messaging')) {
        Cindy.layout('messaging');
        loadCustomers();
        renderPreview();
      }

      document.querySelector('#templateSelect').addEventListener('change', (event) => {
        document.querySelector('#messageText').value = event.target.value;
        renderPreview();
      });
      document.querySelector('#messageText').addEventListener('input', renderPreview);
      document.querySelector('#recipientSearch').addEventListener('input', renderRecipients);
      document.querySelector('#selectAll').addEventListener('click', toggleSelectAll);
      document.querySelector('#loadMoreRecipients').addEventListener('click', () => {
        visibleCount += 20;
        renderRecipients();
      });
      document.querySelector('#messageForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const submitButton = event.currentTarget.querySelector('[type="submit"]');
        const formMessage = document.querySelector('.form-message');
        formMessage.textContent = '';
        const recipients = enrichedCustomers().filter((customer) => selected.has(String(customer.id || customer.customer_id || customer.phone)));
        if (!recipients.length) {
          formMessage.textContent = 'Select at least one customer.';
          return;
        }
        Cindy.setLoading(submitButton, true, 'Opening');
        recipients.forEach((customer, index) => {
          const message = composeFor(customer);
          window.setTimeout(() => window.open(Cindy.whatsappUrl(customer.phone, message), '_blank', 'noopener'), index * 150);
        });
        await Promise.allSettled(recipients.map((customer) => Cindy.api('/messages', {
          method: 'POST',
          body: JSON.stringify({
            customer_id: customer.id || customer.customer_id,
            message_body: composeFor(customer)
          })
        })));
        Cindy.setLoading(submitButton, false);
        Cindy.toast(`Opening ${recipients.length} WhatsApp message${recipients.length === 1 ? '' : 's'}.`);
      });

      async function loadCustomers() {
        try {
          const [payload, subscriptionsPayload, plansPayload, messagesPayload] = await Promise.all([
            Cindy.api('/customers'),
            Cindy.api('/subscriptions').catch(() => []),
            Cindy.api('/plans').catch(() => []),
            Cindy.api('/messages').catch(() => [])
          ]);
          customers = Cindy.normalizeList(payload, ['customers']);
          subscriptions = Cindy.normalizeList(subscriptionsPayload, ['subscriptions']);
          plans = Cindy.normalizeList(plansPayload, ['plans']);
          messageLog = Cindy.normalizeList(messagesPayload, ['messages']);
          renderRecipients();
        } catch (error) {
          document.querySelector('#recipientList').innerHTML = empty('wifi-off', 'Could not load customers. Check the API server and try again.');
          Cindy.toast(error.message);
        } finally {
          Cindy.hydrateIcons();
        }
      }

      function filteredCustomers() {
        const term = document.querySelector('#recipientSearch').value.trim().toLowerCase();
        return enrichedCustomers().filter((customer) => {
          const haystack = `${customer.name || ''} ${customer.phone || ''}`.toLowerCase();
          return !term || haystack.includes(term);
        });
      }

      function renderRecipients() {
        const target = document.querySelector('#recipientList');
        const list = filteredCustomers();
        const page = list.slice(0, visibleCount);
        document.querySelector('#loadMoreRecipients').hidden = list.length <= visibleCount;
        if (!page.length) {
          target.innerHTML = empty('message-circle', 'Customers you add will be available for bulk messaging.');
          Cindy.hydrateIcons();
          return;
        }
        target.innerHTML = page.map((customer) => {
          const id = String(customer.id || customer.customer_id || customer.phone);
          return `
            <label class="check-row">
              <input type="checkbox" value="${Cindy.escapeHtml(id)}" ${selected.has(id) ? 'checked' : ''}>
              <span>
                <strong>${Cindy.escapeHtml(customer.name)}</strong>
                <span class="muted" style="display: block;">${Cindy.escapeHtml(customer.phone)}</span>
              </span>
              ${Cindy.badge(Cindy.statusFor(customer))}
            </label>
          `;
        }).join('');
        target.querySelectorAll('input[type="checkbox"]').forEach((input) => {
          input.addEventListener('change', () => {
            if (input.checked) selected.add(input.value);
            else selected.delete(input.value);
            renderPreview();
          });
        });
      }

      function toggleSelectAll() {
        const list = filteredCustomers();
        const allSelected = list.length && list.every((customer) => selected.has(String(customer.id || customer.customer_id || customer.phone)));
        list.forEach((customer) => {
          const id = String(customer.id || customer.customer_id || customer.phone);
          if (allSelected) selected.delete(id);
          else selected.add(id);
        });
        document.querySelector('#selectAll').textContent = allSelected ? 'Select all' : 'Clear all';
        renderRecipients();
        renderPreview();
      }

      function composeFor(customer) {
        return document.querySelector('#messageText').value
          .replaceAll('{name}', customer.name || 'there')
          .replaceAll('{plan}', customer.plan_name || customer.plan || 'your plan')
          .replaceAll('{expiry}', Cindy.formatDate(customer.expiry_date || customer.expires_at || customer.end_date));
      }

      function renderPreview() {
        const enriched = enrichedCustomers();
        const sample = enriched.find((customer) => selected.has(String(customer.id || customer.customer_id || customer.phone))) || enriched[0] || { name: 'Aarav', plan_name: 'Monthly', expiry_date: new Date() };
        document.querySelector('#messagePreview').textContent = composeFor(sample);
      }

      function empty(icon, message) {
        return `<div class="empty-state"><span class="empty-icon"><i data-lucide="${icon}" class="icon"></i></span><span>${message}</span></div>`;
      }

      function enrichedCustomers() {
        return customers.map((customer) => {
          const subscription = subscriptions.find((item) => String(item.customer_id || item.customerId) === String(customer.id || customer.customer_id));
          const plan = plans.find((item) => String(item.id) === String(subscription?.plan_id || subscription?.planId));
          return {
            ...customer,
            plan_name: customer.plan_name || plan?.name,
            expiry_date: customer.expiry_date || subscription?.expiry_date || subscription?.expires_at || subscription?.end_date,
            subscription_status: customer.subscription_status || subscription?.status
          };
        });
      }
    </script>
  </body>
</html>
