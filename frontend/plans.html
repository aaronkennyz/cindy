<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cindy | Plans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
  </head>
  <body>
    <div class="page-shell">
      <main class="main">
        <section class="topbar">
          <div>
            <h1 class="page-title">Plans</h1>
            <p class="page-subtitle">Keep memberships simple: price, duration, and a clean renewal path.</p>
          </div>
          <button class="btn btn-primary" id="openPlanDrawer" type="button"><i data-lucide="plus" class="icon"></i>Add plan</button>
        </section>

        <section class="grid plans-grid" id="plansGrid"></section>
      </main>
    </div>

    <div class="drawer-backdrop" id="planBackdrop"></div>
    <aside class="drawer" id="planDrawer" aria-label="Plan panel">
      <div class="drawer-header">
        <div>
          <h2 class="card-title" id="planDrawerTitle" style="margin: 0;">Add plan</h2>
          <div class="muted">Plans are used when creating customers.</div>
        </div>
        <button class="btn btn-ghost" type="button" data-close-drawer aria-label="Close"><i data-lucide="x" class="icon"></i></button>
      </div>
      <div class="drawer-body">
        <form class="form" id="planForm">
          <input type="hidden" name="id" id="planId">
          <div class="field">
            <label for="planName">Plan name</label>
            <input id="planName" name="name" type="text" required>
          </div>
          <div class="field">
            <label for="planPrice">Price</label>
            <input id="planPrice" name="price" type="number" min="0" step="1" required>
          </div>
          <div class="field">
            <label for="planDuration">Duration in days</label>
            <input id="planDuration" name="duration_days" type="number" min="1" step="1" required>
          </div>
          <div class="form-message" aria-live="polite"></div>
          <button class="btn btn-primary" type="submit">Save plan</button>
        </form>
      </div>
    </aside>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script type="module">
      import { Cindy } from './assets/app.js';

      let plans = [];
      const drawer = Cindy.bindDrawer('#openPlanDrawer', '#planDrawer', '#planBackdrop');

      if (await Cindy.requireWorkspace('plans')) {
        Cindy.layout('plans');
        loadPlans();
      }

      document.querySelector('#openPlanDrawer').addEventListener('click', () => {
        document.querySelector('#planDrawerTitle').textContent = 'Add plan';
        document.querySelector('#planForm').reset();
        document.querySelector('#planId').value = '';
      });

      Cindy.withSubmit(document.querySelector('#planForm'), async (data, form) => {
        const body = Object.fromEntries(data);
        const id = body.id;
        delete body.id;
        const payload = await Cindy.api(id ? `/plans/${encodeURIComponent(id)}` : '/plans', {
          method: id ? 'PUT' : 'POST',
          body: JSON.stringify(body)
        });
        const saved = payload?.plan || payload?.data || { ...body, id: id || Date.now() };
        if (id) {
          plans = plans.map((plan) => String(plan.id) === String(id) ? { ...plan, ...saved } : plan);
          Cindy.toast('Plan updated.');
        } else {
          plans.unshift(saved);
          Cindy.toast('Plan added.');
        }
        form.reset();
        drawer.close();
        renderPlans();
      });

      async function loadPlans() {
        try {
          const payload = await Cindy.api('/plans');
          plans = Cindy.normalizeList(payload, ['plans']);
          renderPlans();
        } catch (error) {
          document.querySelector('#plansGrid').innerHTML = empty('wifi-off', 'Could not load plans. Check the API server and try again.');
          Cindy.toast(error.message);
        } finally {
          Cindy.hydrateIcons();
        }
      }

      function renderPlans() {
        const target = document.querySelector('#plansGrid');
        if (!plans.length) {
          target.innerHTML = `<section class="card">${empty('badge-dollar-sign', 'Create your first membership plan to start adding customers.')}</section>`;
          Cindy.hydrateIcons();
          return;
        }
        target.innerHTML = plans.map((plan) => `
          <article class="card plan-card" data-id="${Cindy.escapeHtml(plan.id)}">
            <div>
              <h2 class="card-title">${Cindy.escapeHtml(plan.name)}</h2>
              <div class="plan-price">${Cindy.formatCurrency(plan.price)}</div>
              <div class="muted">${Cindy.escapeHtml(plan.duration_days || plan.duration || 30)} days</div>
            </div>
            <div class="confirm-inline" data-confirm="${Cindy.escapeHtml(plan.id)}">
              <span>Delete this plan?</span>
              <button class="btn btn-danger" type="button" data-confirm-delete="${Cindy.escapeHtml(plan.id)}">Delete</button>
              <button class="btn btn-secondary" type="button" data-cancel-delete>Cancel</button>
            </div>
            <div class="btn-row">
              <button class="btn btn-secondary" type="button" data-edit="${Cindy.escapeHtml(plan.id)}"><i data-lucide="pencil" class="icon"></i>Edit</button>
              <button class="btn btn-ghost" type="button" data-delete="${Cindy.escapeHtml(plan.id)}"><i data-lucide="trash-2" class="icon"></i>Delete</button>
            </div>
          </article>
        `).join('');
        bindPlanActions();
        Cindy.hydrateIcons();
      }

      function bindPlanActions() {
        document.querySelectorAll('[data-edit]').forEach((button) => {
          button.addEventListener('click', () => {
            const plan = plans.find((item) => String(item.id) === String(button.dataset.edit));
            if (!plan) return;
            document.querySelector('#planDrawerTitle').textContent = 'Edit plan';
            document.querySelector('#planId').value = plan.id;
            document.querySelector('#planName').value = plan.name || '';
            document.querySelector('#planPrice').value = plan.price || '';
            document.querySelector('#planDuration').value = plan.duration_days || plan.duration || '';
            document.querySelector('#planDrawer').classList.add('open');
            document.querySelector('#planBackdrop').classList.add('open');
          });
        });
        document.querySelectorAll('[data-delete]').forEach((button) => {
          button.addEventListener('click', () => {
            const card = button.closest('.plan-card');
            card.querySelector('.confirm-inline').classList.add('open');
          });
        });
        document.querySelectorAll('[data-cancel-delete]').forEach((button) => {
          button.addEventListener('click', () => button.closest('.confirm-inline').classList.remove('open'));
        });
        document.querySelectorAll('[data-confirm-delete]').forEach((button) => {
          button.addEventListener('click', async () => {
            const id = button.dataset.confirmDelete;
            try {
              await Cindy.api(`/plans/${encodeURIComponent(id)}`, { method: 'DELETE' });
              plans = plans.filter((plan) => String(plan.id) !== String(id));
              renderPlans();
              Cindy.toast('Plan deleted.');
            } catch (error) {
              Cindy.toast(error.message);
            }
          });
        });
      }

      function empty(icon, message) {
        return `<div class="empty-state"><span class="empty-icon"><i data-lucide="${icon}" class="icon"></i></span><span>${message}</span></div>`;
      }
    </script>
  </body>
</html>
