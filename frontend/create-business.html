<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cindy | Create Business</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <script>
      (function() {
        function applySavedColorMode() {
          const themeMode = localStorage.getItem('cindy-ui-theme');
          const isDark = themeMode === 'dark';
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
          document.body.classList.toggle('theme-dark', isDark);
          document.body.classList.toggle('theme-default', !isDark);
        }

        if (document.body) {
          applySavedColorMode();
        } else {
          document.addEventListener('DOMContentLoaded', applySavedColorMode, { once: true });
        }
      })();
    </script>
  </head>
  <body class="auth-body">
    <main class="setup-card">
      <h1 class="page-title">Set up your workspace</h1>
      <p class="page-subtitle">Choose the kind of business you run, then name the workspace your team will use every day.</p>

      <form class="form" id="businessForm" method="post">
        <input type="hidden" name="type" id="businessType" value="gym">
        <div class="business-options" aria-label="Business type">
          <button class="business-card active" type="button" data-business-type="gym"><i data-lucide="dumbbell" class="icon"></i><span>Gym</span></button>
          <button class="business-card" type="button" data-business-type="cafe"><i data-lucide="coffee" class="icon"></i><span>Cafe</span></button>
          <button class="business-card" type="button" data-business-type="bakery"><i data-lucide="croissant" class="icon"></i><span>Bakery</span></button>
          <button class="business-card" type="button" data-business-type="salon"><i data-lucide="scissors" class="icon"></i><span>Salon</span></button>
          <button class="business-card" type="button" data-business-type="other"><i data-lucide="store" class="icon"></i><span>Other</span></button>
        </div>
        <div class="field">
          <label for="businessName">Business name</label>
          <input id="businessName" name="name" type="text" required>
        </div>
        <div class="form-message" aria-live="polite"></div>
        <div class="btn-row" style="justify-content: flex-end;">
          <button class="btn btn-primary" type="submit">Create workspace</button>
        </div>
      </form>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script type="module">
      import { Cindy } from './assets/app.js';

      if (!Cindy.redirectOnMissingAuth()) {
        Cindy.hydrateIcons();
      }

      document.querySelectorAll('[data-business-type]').forEach((button) => {
        button.addEventListener('click', () => {
          document.querySelectorAll('[data-business-type]').forEach((item) => item.classList.toggle('active', item === button));
          document.querySelector('#businessType').value = button.dataset.businessType;
        });
      });

      Cindy.withSubmit(document.querySelector('#businessForm'), async (data) => {
        const payload = await Cindy.api('/business', {
          method: 'POST',
          body: JSON.stringify(Object.fromEntries(data))
        });
        const business = payload?.business || payload?.data || payload;
        if (business?.id) {
          const businesses = await Cindy.loadBusinesses().catch(() => [business]);
          Cindy.setBusinesses(businesses);
          Cindy.setSelectedBusinessId(business.id);
        }
        Cindy.toast('Workspace created.');
        window.location.href = 'dashboard.html';
      });
    </script>
  </body>
</html>
